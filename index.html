<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1b32">
<title>Hamburg Live – Uhrzeit, Datum & Temperatur</title>
<style>
:root{color-scheme:dark;--glass:rgba(7,20,39,.78);--line:rgba(255,255,255,.16);--muted:#c4d1e2;--accent:#7dd3fc}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,Segoe UI,Arial,sans-serif;color:#fff;background:#0b1b32 url("https://commons.wikimedia.org/wiki/Special:FilePath/Hamburg,_Blick_von_der_Elbphilharmonie_zum_Steinwerder_Hafen.jpg?width=2200") center/cover fixed no-repeat}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(115deg,rgba(3,13,29,.78),rgba(3,13,29,.38) 55%,rgba(3,13,29,.76));z-index:-1}
main{width:min(1440px,94%);margin:0 auto;padding:28px 0 22px}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:14px}.mark{width:48px;height:48px;border-radius:15px;background:#d62828;display:grid;place-items:center;font-size:27px;box-shadow:0 8px 28px #0006}
h1{font-size:clamp(25px,4vw,42px);margin:0;letter-spacing:-1px}.subtitle{color:var(--muted);margin-top:5px;font-size:14px}
.header-right{text-align:right;color:var(--muted);font-size:13px}.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4ade80;margin-right:7px;box-shadow:0 0 12px #4ade80}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;margin-bottom:18px}
.panel,.tile{background:var(--glass);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(14px);box-shadow:0 18px 50px #0004}
.clock-panel{padding:24px 28px;display:flex;flex-direction:column;justify-content:center;min-height:190px}
.clock{font-size:clamp(48px,8vw,92px);font-weight:750;letter-spacing:-3px;line-height:1;font-variant-numeric:tabular-nums}
.date{font-size:clamp(16px,2vw,21px);color:#dce8f5;margin-top:13px}
.weather-panel{padding:22px 24px;display:flex;flex-direction:column;justify-content:center}
.weather-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.temp{font-size:clamp(42px,6vw,66px);font-weight:750;letter-spacing:-2px}.weather-icon{font-size:55px}.condition{font-size:18px;color:#e5eef9;margin-top:2px}
.weather-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.metric small{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.metric strong{font-size:16px}
.section-title{font-size:18px;font-weight:700;margin:26px 2px 13px;display:flex;align-items:center;gap:9px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{padding:18px;min-height:158px;overflow:hidden}.tile-head{display:flex;align-items:center;gap:10px;margin-bottom:13px}.tile-icon{font-size:23px}.tile h2{font-size:16px;margin:0}.status{font-size:12px;color:var(--muted);margin-left:auto}
.tile-content{font-size:14px;color:#e6eef8;line-height:1.5}.tile-content .empty{color:#b7c5d8;font-style:italic}.data-list{display:grid;gap:7px}.data-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:5px}.data-row:last-child{border:0}.data-row span:first-child{color:#c0cede}.data-row span:last-child{text-align:right;font-weight:600;overflow-wrap:anywhere}
.forecast{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px}.day{background:#ffffff0c;border-radius:13px;padding:10px 5px;text-align:center}.day small{display:block;color:var(--muted);font-size:11px}.day b{display:block;font-size:20px;margin:5px 0}.day span{font-size:12px}
footer{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#c0cede;font-size:12px;margin:22px 3px 0}
a{color:#a5e2ff;text-decoration:none}a:hover{text-decoration:underline}
button{border:1px solid var(--line);background:#ffffff12;color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;cursor:pointer}button:hover{background:#ffffff24}
@media(max-width:850px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){main{width:92%;padding-top:18px}.header-right{display:none}.grid{grid-template-columns:1fr}.clock-panel{min-height:145px;padding:20px}.weather-meta{grid-template-columns:repeat(2,1fr)}.tile{min-height:130px}.forecast{gap:5px}.day{padding:8px 2px}}
</style>
</head>
<body>
<main>
<header>
 <div class="brand"><div class="mark">⚓</div><div><h1>Hamburg Live</h1><div class="subtitle">Uhrzeit, Datum & aktuelle Temperatur</div></div></div>
 <div class="header-right"><div><span class="live-dot"></span>Online-Dashboard</div><div id="updated">Daten werden geladen …</div></div>
</header>
<section class="hero">
 <div class="panel clock-panel"><div class="clock" id="clock">--:--:--</div><div class="date" id="date">Hamburg</div></div>
 <div class="panel weather-panel">
  <div class="weather-top"><div><div class="temp" id="temperature">--°</div></div><div class="weather-icon" id="weatherIcon">🌤️</div></div>
  
 </div>
</section>
<footer><div>Temperatur: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></div><div>Hintergrundfoto: Dguendel, <a href="https://commons.wikimedia.org/wiki/File:Hamburg,_Blick_von_der_Elbphilharmonie_zum_Steinwerder_Hafen.jpg" target="_blank" rel="noopener">Wikimedia Commons (CC BY 4.0)</a> · <span id="refreshText">Aktualisierung alle 10 Minuten</span></div></footer>
</main>
<script>
const $=id=>document.getElementById(id);
function tick(){const n=new Date();$('clock').textContent=n.toLocaleTimeString('de-DE',{timeZone:'Europe/Berlin'});$('date').textContent=n.toLocaleDateString('de-DE',{timeZone:'Europe/Berlin',weekday:'long',day:'2-digit',month:'long',year:'numeric'});}
tick();setInterval(tick,1000);
const weatherText={0:['Klarer Himmel','☀️'],1:['Überwiegend klar','🌤️'],2:['Teilweise bewölkt','⛅'],3:['Bedeckt','☁️'],45:['Neblig','🌫️'],48:['Nebel mit Reif','🌫️'],51:['Leichter Nieselregen','🌦️'],53:['Nieselregen','🌦️'],55:['Starker Nieselregen','🌧️'],61:['Leichter Regen','🌦️'],63:['Regen','🌧️'],65:['Starker Regen','🌧️'],71:['Leichter Schneefall','🌨️'],73:['Schneefall','🌨️'],75:['Starker Schneefall','❄️'],80:['Regenschauer','🌦️'],81:['Regenschauer','🌧️'],82:['Starke Regenschauer','⛈️'],95:['Gewitter','⛈️'],96:['Gewitter mit Hagel','⛈️'],99:['Starkes Gewitter','⛈️']};
async function getWeather(){try{const url='https://api.open-meteo.com/v1/forecast?latitude=53.5511&longitude=9.9937&current=temperature_2m,weather_code&timezone=Europe%2FBerlin';const r=await fetch(url);if(!r.ok)throw Error();const d=await r.json(),c=d.current;const w=weatherText[c.weather_code]||['','🌡️'];$('temperature').textContent=Math.round(c.temperature_2m)+'°C';$('weatherIcon').textContent=w[1];$('updated').textContent='Zuletzt aktualisiert: '+new Date().toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});}catch(e){$('temperature').textContent='--°C';$('updated').textContent='Temperaturdaten nicht erreichbar';}}
getWeather();setInterval(getWeather,600000);
</script>
</body>
</html>
